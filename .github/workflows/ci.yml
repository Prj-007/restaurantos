name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Dummy values so build-time code that reads these env vars doesn't
      # crash. Nothing in the build actually connects to a database or
      # calls Gemini — Prisma Client is generated from schema.prisma alone.
      DATABASE_URL: "postgresql://user:password@localhost:5432/restaurantos"
      JWT_SECRET: "ci-only-dummy-secret"
      GEMINI_API_KEY: "ci-only-dummy-key"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .
        continue-on-error: true # a couple of stylistic React-Compiler lint rules are non-blocking

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
